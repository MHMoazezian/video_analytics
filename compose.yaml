# Isolated API-only compose for this repository.
# The full stack (frontend, postgres, MediaMTX, this service) is started from
# Tarebar-Smart-Monitoring-Platform/docker-compose.dev.yml.
services:
  api:
    build:
      context: .
    image: video-analytics-mvp:local
    init: true
    ports:
      - "${VIDEO_ANALYTICS_PORT:-8000}:8000"
    environment:
      VIDEO_ANALYTICS_CORS_ORIGINS: "${VIDEO_ANALYTICS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      VIDEO_ANALYTICS_JOB_WORKERS: "${VIDEO_ANALYTICS_JOB_WORKERS:-1}"
      VIDEO_ANALYTICS_MAX_UPLOAD_BYTES: "${VIDEO_ANALYTICS_MAX_UPLOAD_BYTES:-1073741824}"
      VIDEO_ANALYTICS_PROCESSING_WIDTH: "${VIDEO_ANALYTICS_PROCESSING_WIDTH:-1280}"
      VIDEO_ANALYTICS_FRAME_STRIDE: "${VIDEO_ANALYTICS_FRAME_STRIDE:-10}"
      VIDEO_ANALYTICS_FLEET_ENABLED: "${VIDEO_ANALYTICS_FLEET_ENABLED:-false}"
      VIDEO_ANALYTICS_FLEET_FPS: "0.5"
      VIDEO_ANALYTICS_TRACKER: "${VIDEO_ANALYTICS_TRACKER:-stabletrack}"
      VIDEO_INSIGHT_MODEL_PATH: "/models/${VIDEO_INSIGHT_MODEL_DIRNAME:-Qwen3-VL-2B-Instruct}"
      VIDEO_INSIGHT_MIN_PIXELS: "${VIDEO_INSIGHT_MIN_PIXELS:-65536}"
      VIDEO_INSIGHT_MAX_PIXELS: "${VIDEO_INSIGHT_MAX_PIXELS:-147456}"
      VIDEO_INSIGHT_LIVE_SAMPLE_INTERVAL_SECONDS: "${VIDEO_INSIGHT_LIVE_SAMPLE_INTERVAL_SECONDS:-0.75}"
      VIDEO_INSIGHT_PRELOAD: "${VIDEO_INSIGHT_PRELOAD:-true}"
      MEDIAMTX_RTSP_URL: "${MEDIAMTX_RTSP_URL:-rtsp://host.docker.internal:8554}"
      ANALYTICS_DATABASE_URL: "${ANALYTICS_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/tarebar}"
      ANALYTICS_READ_KEY: "${ANALYTICS_READ_KEY:-local-read-key-change-me}"
      ANALYTICS_INGEST_KEY: "${ANALYTICS_INGEST_KEY:-local-ingest-key-change-me}"
      VIDEO_ANALYTICS_INGEST_URL: "http://127.0.0.1:8000/api/v1/ingest/minutes"
      ANALYTICS_OUTBOX_DIR: "/app/output/outbox"
    volumes:
      - analytics-jobs:/app/output/dashboard
      - analytics-outbox:/app/output/outbox
      - ${VIDEO_INSIGHT_MODELS_DIR:-../tarebar-deployment/models}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  analytics-jobs:
  analytics-outbox:
