[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analytics-mvp"
version = "0.1.0"
description = "Headless-first video people analytics MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "onnxruntime>=1.17,<2",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6,<7",
    "trackers>=2.5,<2.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.27,<1",
]
dashboard = [
    "streamlit>=1.32,<2",
]
video-insight = [
    # torch is provided by the shared py3.11-torch2.5.1-cu118 image.
    "accelerate==1.10.1",
    "bitsandbytes==0.47.0",
    "huggingface-hub==0.34.4",
    "safetensors==0.6.2",
    "tokenizers==0.22.1",
    "transformers==4.57.1",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
video-analytics-detect = "app.detection.cli:main"
video-analytics-track = "app.tracking.cli:main"
video-analytics-count = "app.analytics.cli:main"
video-analytics-synthetic = "app.synthetic.cli:main"
video-analytics-benchmark = "app.tracking.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.tracking" = ["configs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
