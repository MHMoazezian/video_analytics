name: Build and push video-analytics image

on:
  push:
    # TEMPORARY: feat/docker-cicd-redesign is for GHCR publish validation only.
    branches: [master, main, development, feat/docker-cicd-redesign, feat-video-interpreting, feat-fruit-quality]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/video-analytics

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ONNX model weights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEIGHTS_RELEASE_TAG: v1.0-models
          WEIGHTS_ARCHIVE: weights.tgz
          WEIGHTS_ARCHIVE_URL: ${{ secrets.VIDEO_ANALYTICS_WEIGHTS_URL }}
        run: |
          set -euo pipefail
          dest="All_weights/Weights_final"
          mkdir -p "$dest"
          detector="$dest/HumanDetection_light_input_640.onnx"
          reid="$dest/Tracking_osnet_x0_25_msmt17.onnx"
          if [[ -f "$detector" && -f "$reid" ]]; then
            echo "Model weights present in the checkout."
            exit 0
          fi
          # Private repos 404 on /releases/download/ even with GITHUB_TOKEN.
          # gh uses the GitHub API, which can read the same-repo release asset.
          if [[ -n "${WEIGHTS_ARCHIVE_URL:-}" ]]; then
            echo "Downloading ONNX weights from ${WEIGHTS_ARCHIVE_URL}"
            curl -fsSL "$WEIGHTS_ARCHIVE_URL" -o "/tmp/${WEIGHTS_ARCHIVE}"
          else
            echo "Downloading ${WEIGHTS_ARCHIVE} from release ${WEIGHTS_RELEASE_TAG}"
            gh release download "${WEIGHTS_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${WEIGHTS_ARCHIVE}" \
              --dir /tmp
          fi
          tar -xzf "/tmp/${WEIGHTS_ARCHIVE}" -C .
          test -f "$detector"
          test -f "$reid"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image version label
        run: |
          if [ "${GITHUB_REF_TYPE}" = "branch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_LABEL=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_LABEL=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.sha }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION_LABEL }}
